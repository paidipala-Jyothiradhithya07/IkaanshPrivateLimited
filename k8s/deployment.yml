# Basic manifest: kubectl apply -f k8s/deployment.yaml
# Assumes a reachable PostgreSQL (edit DB_URL). Replace the Secret values before real use.
apiVersion: v1
kind: Secret
metadata:
  name: finance-api-secrets
type: Opaque
stringData:
  DB_USER: finance
  DB_PASSWORD: change-me
  JWT_SECRET: change-me-to-a-random-string-of-32-plus-characters
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-api
  labels: { app: finance-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: finance-api }
  template:
    metadata:
      labels: { app: finance-api }
    spec:
      containers:
        - name: finance-api
          image: finance-api:1.0.0          # docker build -t finance-api:1.0.0 .
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/finance
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: finance-api-secrets, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: finance-api-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: finance-api-secrets, key: JWT_SECRET } }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits:   { cpu: "1",  memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: finance-api
spec:
  selector: { app: finance-api }
  ports:
    - port: 80
      targetPort: 8080

server:
  port: 8080

spring:
  application:
    name: finance-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DB_USER:finance}
    password: ${DB_PASSWORD:finance}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}   # use "validate" if you load db/schema.sql yourself
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  jwt:
    # MUST be >= 32 characters. Override with JWT_SECRET in any real environment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    access-ttl-seconds: ${JWT_ACCESS_TTL:900}        # 15 minutes
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true